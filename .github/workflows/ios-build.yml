name: iOS Build (unsigned ipa)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no signing)
        run: |
          set -euo pipefail
          xcodebuild -project CarPlayer.xcodeproj \
            -scheme CarPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/CarPlayer.app"
          test -d "$APP"
          mkdir -p build/Payload dist
          cp -R "$APP" build/Payload/
          cd build && zip -qry "../dist/CarPlayer-1.9.14-unsigned.ipa" Payload
          ls -lh ../dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayer-unsigned-ipa
          path: dist/*.ipa
          retention-days: 30


